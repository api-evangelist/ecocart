aid: ecocart
name: EcoCart
description: >-
  EcoCart is a sustainable-commerce platform that embeds climate contributions,
  shipping protection, and returns management directly into the e-commerce
  checkout experience. It lets merchants calculate and offset the carbon
  footprint of orders, offer package protection, provide returns and cashback
  incentives, and communicate their sustainability story across the customer
  journey. EcoCart reports helping over 2,000 merchants mitigate more than 400
  million pounds of greenhouse gases. The platform integrates with major
  e-commerce systems and exposes a developer API (hosted on Stoplight at
  api.ecocart.io) plus a first-party React component library for embedding
  sustainable-checkout surfaces into storefronts. EcoCart is backed by 500
  Global.
